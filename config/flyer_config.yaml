behaviors:
  Flyer:
    trainer_type: ppo
    hyperparameters:
      batch_size: 1024       # Increased for more stable gradient updates
      buffer_size: 10240      # 10x batch_size is a good rule of thumb
      learning_rate: 3.0e-4   # A standard, reliable learning rate
      beta: 1.0e-2            # Encourages more exploration, which is good for avoiding local minima
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
      learning_rate_schedule: linear
    network_settings:
      normalize: true
      hidden_units: 256       # More neurons to process more complex data
      num_layers: 3           # A deeper network for more abstract reasoning
    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0
    max_steps: 5000000        # Increased to give the agent enough time to learn the harder task
    time_horizon: 128         # Agent can look further into the future to make better decisions
    summary_freq: 10000